  <dialog class="site-dialog contact-dialog" id="contact-message" aria-labelledby="message-title">
    <button type="button" class="dialog-close" data-message-close aria-label="Close">×</button>
    <h2 id="message-title">Leave me a message</h2>
    <p class="form-note">A little about your setup, your question, or what you’d like to explore together.</p>
    <form data-message-form>
      <div class="form-field-pair">
        <div><label for="message-name">Your name</label><input id="message-name" name="name" autocomplete="name" maxlength="80" required></div>
        <div><label for="message-email">Email for my reply</label><input id="message-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      </div>
      <label for="message-text">Message</label>
      <textarea id="message-text" name="message" rows="6" minlength="10" maxlength="6000" required></textarea>
      <div class="form-trap" aria-hidden="true"><label for="message-website">Website</label><input id="message-website" name="website" tabindex="-1" autocomplete="off"></div>
      <div data-message-challenge></div>
      <div class="form-actions"><span class="form-note">This message is private.</span><button type="submit" class="form-submit" disabled>Send message</button></div>
      <p class="form-status" data-message-status role="status">The message form isn’t connected yet. Please <a href="mailto:julius.stoerk@gmail.com">email me directly</a> for now.</p>
    </form>
    <!--#CONTACT_CONFIG-->
  </dialog>
