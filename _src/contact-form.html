  <aside class="contact-message" id="contact-message" aria-label="Send a private message" data-comment-homeserver="<!--#COMMENT_HOMESERVER-->" hidden>
    <button type="button" class="message-close" data-message-close aria-label="Close message form">×</button>
    <form action="<!--#CONTACT_ENDPOINT-->" method="POST" data-message-form>
      <div class="form-field-pair">
        <div><label for="message-name">Your name</label><input id="message-name" name="name" autocomplete="name" maxlength="80" required></div>
        <div><label for="message-email">Email for my reply</label><input id="message-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      </div>
      <label for="message-text">Message</label>
      <textarea id="message-text" name="message" rows="6" maxlength="6000" required></textarea>
      <div class="form-trap" aria-hidden="true"><label for="message-website">Website</label><input id="message-website" name="_gotcha" tabindex="-1" autocomplete="off"></div>
      <div class="form-actions"><span class="form-note">This message is private.</span><button type="submit" class="form-submit">Send message</button></div>
    </form>
  </aside>
