name = "rapid-fog-462d"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[vars]
SITE_ORIGIN = "https://j-stoerk.github.io"

[[d1_databases]]
binding = "DB"
database_name = "j-stoerk-comments"
# Copy the existing database ID from the D1 dashboard if using Wrangler.
database_id = ""
migrations_dir = "migrations"

# TURNSTILE_SECRET is set using wrangler secret put, never in this file.
# TURNSTILE_SECRET_KEY is also accepted for older configurations.
