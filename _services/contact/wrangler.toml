name = "j-stoerk-contact"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE_ORIGIN = "https://j-stoerk.github.io"
CONTACT_TO = "julius.stoerk@gmail.com"
# Replace with an address on your Resend-verified sending domain before deploying.
CONTACT_FROM = ""

[[ratelimits]]
name = "CONTACT_RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 3
period = 60
