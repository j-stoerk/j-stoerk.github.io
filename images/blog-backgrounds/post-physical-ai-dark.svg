<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1800" viewBox="0 0 1000 1800" fill="none"><style>.art-ink,
.art-ink-soft,
.art-hair,
.art-blue,
.art-gold {
  fill: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.art-ink {
  stroke: rgba(196, 210, 230, .38);
  stroke-width: 1.6;
}

.art-ink-soft {
  stroke: rgba(196, 210, 230, .2);
  stroke-width: 1.2;
}

/* Hairline filigree — the finest lines (tree-rings, arcs, contours). */
.art-hair {
  stroke: rgba(196, 210, 230, .2);
  stroke-width: 0.6;
}

.art-blue, .art-gold {
  stroke-width: 1.2;
  stroke-opacity: .55;
}

.art-blue { stroke: #5a82be; }
.art-gold { stroke: #b28945; }

.art-fill-ink {
  fill: rgba(196, 210, 230, .38);
  stroke: none;
}

/* Stipple dots for organic growth. */
.art-dot {
  fill: rgba(196, 210, 230, .2);
  stroke: none;
}</style>
