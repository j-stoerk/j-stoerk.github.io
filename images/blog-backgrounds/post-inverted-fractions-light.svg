<svg width="1000" height="5200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 5200" preserveAspectRatio="none" fill="none"><style>.art-ink,
.art-ink-soft,
.art-hair {
  fill: none;
  vector-effect: non-scaling-stroke;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.art-ink {
  stroke: rgba(38, 48, 62, .42);
  stroke-width: 1.6;
}

.art-ink-soft {
  stroke: rgba(38, 48, 62, .22);
  stroke-width: 1.2;
}

/* Hairline filigree — the finest lines (tree-rings, arcs, contours). */
.art-hair {
  stroke: rgba(38, 48, 62, .22);
  stroke-width: 0.6;
}

.art-fill-ink {
  fill: rgba(38, 48, 62, .42);
  stroke: none;
}

/* Stipple dots for organic growth. */
.art-dot {
  fill: rgba(38, 48, 62, .22);
  stroke: none;
}</style>
